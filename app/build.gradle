plugins {
    id 'com.android.application'
}

android {
    namespace 'club.practicaintegral.pasos'
    compileSdk 34

    defaultConfig {
        applicationId 'club.practicaintegral.pasos'
        minSdk 26
        targetSdk 34
        // La compilación automática de GitHub pone el número de versión
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName System.getenv('VERSION_NAME') ?: '1.0'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('KEYSTORE_FILE') ?: 'sin-clave.p12')
            storePassword System.getenv('KEYSTORE_PASSWORD')
            keyAlias 'pasos'
            keyPassword System.getenv('KEYSTORE_PASSWORD')
            storeType 'pkcs12'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Entrar con Google (selector de cuentas de Android): Google no deja abrir su ventana dentro de un WebView
    // Hace falta en Android 8 a 13: el selector de Google usa androidx.activity.ComponentActivity (sin esto la app se cierra al pulsar el botón)
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}
